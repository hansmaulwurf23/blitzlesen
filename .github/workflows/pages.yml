# Web-App auf GitHub Pages: testet und veröffentlicht web/ bei jedem Push auf main, der die Web-App
# betrifft (oder von Hand über "Run workflow"). Die Tests vergleichen die 100 Wörter auch mit der
# Android-App, deshalb löst Words.java ebenfalls aus.
#
# Voraussetzung (einmalig): Settings → Pages → Source "GitHub Actions".

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'app/src/main/java/de/noisebleed/lesen/words/Words.java'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Veröffentlichungen gleichzeitig; eine laufende wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Tests
        run: node --test web/test/*.test.mjs

      # Ohne Tests; __VERSION__ wird zur Commit-Kennung: About-Dialog zeigt sie, und der Service
      # Worker bekommt damit bei jeder Veröffentlichung einen frischen Cache.
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r web/. _site/
          rm -rf _site/test
          SHA="${GITHUB_SHA::8}"
          sed -i "s/__VERSION__/${SHA}/" _site/app.js _site/sw.js
          grep -q "${SHA}" _site/sw.js

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
