# Release-Pipeline: laeuft ausschliesslich fuer Tags der Form v<Ziffer>, sonst gar nicht. Ein Tag
# zu pushen ist damit die einzige Aktion, die ein Release erzeugt.
#
# Voraussetzungen (einmalig, siehe README-Abschnitt "Release ueber CI"):
#   - Runner mit Docker-Executor und dem Tag `docker`
#   - geschuetzte CI-Variablen ANDROID_KEYSTORE_B64 (Typ File), ANDROID_KEYSTORE_PASSWORD,
#     ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   - geschuetztes Tag-Muster v* — nur dann gibt GitLab die geschuetzten Variablen heraus

stages:
  - build
  - release

variables:
  # Gradle-Home ins Projektverzeichnis, damit cache: ueberhaupt greifen kann.
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

.tag_only: &tag_only
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'

build-apk:
  stage: build
  # Fest gepinnt auf die Kombination, gegen die auch lokal gebaut wird: JDK 17, build-tools 34.0.0,
  # Plattform android-34. ANDROID_HOME ist im Image gesetzt, local.properties braucht es deshalb nicht.
  image: mobiledevops/android-sdk-image:34.0.0-jdk17
  tags:
    - docker
  <<: *tag_only
  cache:
    key: gradle
    paths:
      - .gradle/wrapper
      - .gradle/caches
  script:
    - export VERSION="${CI_COMMIT_TAG#v}"
    # Signaturmaterial aus den geschuetzten Variablen zusammensetzen. Der Keystore ist binaer und
    # liegt deshalb base64-kodiert in der Variablen; storeFile wird relativ zur Properties-Datei
    # aufgeloest, siehe app/build.gradle.
    - mkdir -p .ci-signing
    - base64 -d "$ANDROID_KEYSTORE_B64" > .ci-signing/lesen-release.jks
    - |
      printf 'storeFile=lesen-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
        "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
        > .ci-signing/keystore.properties
    - ./gradlew assembleRelease -Plesen.signing="$CI_PROJECT_DIR/.ci-signing/keystore.properties"
    - mv app/build/outputs/apk/release/app-release.apk "Lesen-${VERSION}.apk"
    # Unsigniert durchrutschen waere der schlimmste Fall: das APK liesse sich verteilen, aber nie
    # aktualisieren. Deshalb hart pruefen statt nur bauen.
    - $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "Lesen-${VERSION}.apk"
    # Und der Tag muss zu versionName passen, sonst zeigt der About-Dialog etwas anderes an als der
    # Download heisst.
    - |
      APK_VERSION=$($ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging "Lesen-${VERSION}.apk" \
        | grep -o "versionName='[^']*'" | cut -d"'" -f2)
      if [ "$APK_VERSION" != "$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG passt nicht zu versionName $APK_VERSION"
        exit 1
      fi
    - |
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "Lesen-${VERSION}.apk" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lesen/${VERSION}/Lesen-${VERSION}.apk"
    # Fuer das Selbst-Update der App (update/AppUpdater): versionCode und Pruefsumme neben das APK.
    # Die App vergleicht den versionCode mit ihrem eigenen und prueft nach dem Download die SHA-256.
    - |
      APK_CODE=$($ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging "Lesen-${VERSION}.apk" \
        | grep -o "versionCode='[0-9]*'" | cut -d"'" -f2)
      printf '{"version_code":%s,"version_name":"%s","sha256":"%s","size":%s,"apk":"%s"}\n' \
        "$APK_CODE" "$VERSION" "$(sha256sum "Lesen-${VERSION}.apk" | cut -d' ' -f1)" \
        "$(stat -c %s "Lesen-${VERSION}.apk")" "Lesen-${VERSION}.apk" > update.json
      cat update.json
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file update.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lesen/${VERSION}/update.json"
    # VERSION an den naechsten Job durchreichen: im release-Schluessel expandieren nur CI-Variablen,
    # keine im script gesetzten Shell-Variablen.
    - echo "VERSION=${VERSION}" > build.env
  after_script:
    - rm -rf .ci-signing
  artifacts:
    paths:
      - "Lesen-*.apk"
    reports:
      dotenv: build.env
    expire_in: 30 days

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - docker
  needs:
    - job: build-apk
      artifacts: true
  <<: *tag_only
  script:
    - echo "Release $CI_COMMIT_TAG mit Lesen-${VERSION}.apk"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Lesen $VERSION"
    description: |
      Blitzlesen für Kinder: die 100 häufigsten Wörter aus dem Grundwortschatz als zufällige
      Karteikarten. Eine Minute lang lesen, jede Karte grün ("kann ich") oder gelb ("hakt noch")
      bewerten — daraus entstehen zwei Stapel, dazu Lesezeit je Wort und eine Bestenliste.

      **Installation:** APK herunterladen und öffnen. Android fragt einmalig nach der Erlaubnis,
      Apps aus dieser Quelle zu installieren; Play Protect zeigt bei selbst signierten Apps eine
      Warnung, die man bestätigen kann. Voraussetzung ist Android 8 oder neuer.
    assets:
      links:
        - name: "Lesen $VERSION (Android-APK)"
          # Bewusst die Paket-Registry und nicht die Projekt-Uploads: nur diese URL funktioniert bei
          # einem oeffentlichen Projekt ohne Anmeldung und uebersteht einen Namespace-Wechsel.
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/lesen/$VERSION/Lesen-$VERSION.apk"
          link_type: package
