<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lesen – Blitzlesen</title>
  <meta name="description" content="Blitzlesen für Kinder: zufällige Wortkarten, eine Minute, zwei Stapel. Ohne Anmeldung, alles bleibt im Browser.">
  <meta name="theme-color" content="#15161C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lesen">
  <script>
    // Vor dem ersten Zeichnen, damit nichts aufblitzt. Dunkel ist die Voreinstellung wie in der App.
    try {
      if (localStorage.getItem('lesen.design') === 'hell') {
        document.documentElement.dataset.theme = 'light';
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="app"></main>
  <div id="toast" role="status" hidden></div>
  <noscript><p class="noscript">Lesen braucht JavaScript.</p></noscript>
</body>
</html>
